name: Test and package Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure Electron runtime is installed
        run: node node_modules/electron/install.js
      - name: Run tests
        run: npm test
      - name: Build production UI and API
        run: npm run build
      - name: Smoke-test Electron and Windows encryption
        run: npm run test:electron
      - name: Package Windows executable
        run: npx electron-builder --win portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Sophos-OTP-Windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sophos-OTP-Windows-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem release/* -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @executables --title "Sophos OTP $env:RELEASE_TAG" --generate-notes
